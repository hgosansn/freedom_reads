<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Balance, transition, and imbalance</title>
  <desc id="desc">Overlapping two-sided trade contracts into a boundary, then directional range expansion establishes trade at higher prices.</desc>
  <rect width="960" height="420" rx="24" fill="#0b1220"/>
  <rect x="65" y="105" width="390" height="220" rx="12" fill="#2563eb" opacity=".12" stroke="#5b8cff" stroke-width="2"/>
  <path d="M80 250L130 160L180 275L230 145L280 260L330 155L380 250L440 170L500 160L555 145L620 110L690 125L760 75L830 92L900 48" fill="none" stroke="#38e08f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M455 65V355" stroke="#f4c95d" stroke-width="2" stroke-dasharray="8 8"/>
  <g fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700"><text x="75" y="75">Balance</text><text x="465" y="365">Transition</text><text x="700" y="365">Imbalance</text></g>
  <g fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="15"><text x="120" y="350">Overlap + stable value</text><text x="650" y="165">Range expansion + migrating value</text></g>
</svg>
