<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Failed auction reversal limit-entry model</title>
  <desc id="desc">Long example: price tests below a 100 boundary to 98.80, reclaims the boundary, authorizes a 100.20 retest buy limit, and rotates toward 103.50 POC. Acceptance below the boundary cancels the order and the failed extreme defines invalidation.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#f8fafc"/></marker></defs>
  <rect width="960" height="520" rx="24" fill="#0b1220"/>
  <rect x="72" y="86" width="816" height="254" rx="12" fill="#2563eb" opacity=".10" stroke="#5b8cff" stroke-width="2"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="72" y="50" fill="#f8fafc" font-size="24" font-weight="700">Failed auction reversal — triggered retest limit</text>
    <g stroke-width="2" stroke-dasharray="8 7"><path d="M72 132H888" stroke="#38e08f"/><path d="M72 252H888" stroke="#f4c95d"/><path d="M72 378H888" stroke="#ef5b5b"/></g>
    <g font-size="15" font-weight="700"><text x="76" y="122" fill="#38e08f">POC / TARGET 1 · 103.50</text><text x="76" y="242" fill="#f4c95d">BOUNDARY R · 100.00</text><text x="76" y="368" fill="#ef5b5b">FAILED EXTREME · 98.80</text></g>
    <path d="M100 188L185 230L270 195L350 245L430 325L505 385L565 292L625 218L700 252L770 182L855 128" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="505" cy="385" r="8" fill="#ef5b5b"/><circle cx="625" cy="218" r="8" fill="#38e08f"/><circle cx="700" cy="252" r="9" fill="#f4c95d"/>
    <path d="M625 198V155" stroke="#38e08f" stroke-width="2" marker-end="url(#arrow)"/><text x="570" y="146" fill="#38e08f" font-size="15" font-weight="700">RECLAIM AUTHORIZES ORDER</text>
    <path d="M700 273V318" stroke="#f4c95d" stroke-width="2" marker-end="url(#arrow)"/><text x="624" y="342" fill="#f4c95d" font-size="16" font-weight="700">BUY LIMIT · 100.20</text>
    <text x="414" y="414" fill="#ef5b5b" font-size="15">Stop below 98.80 + buffer</text>
    <rect x="72" y="448" width="816" height="42" rx="9" fill="#172033"/><text x="92" y="474" fill="#cbd5e1" font-size="15">Cancel unfilled: acceptance below R · POC trades first · trigger expires</text>
  </g>
</svg>
