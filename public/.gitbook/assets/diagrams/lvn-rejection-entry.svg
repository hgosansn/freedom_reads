<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">LVN rejection and reclaim limit-entry model</title>
  <desc id="desc">Long example: price tests from an upper distribution into a low-volume corridor from 98.80 to 100, rejects it, reclaims the 100 upper lip, and retests a 100.20 buy limit. Acceptance below 98.80 invalidates.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#f8fafc"/></marker></defs>
  <rect width="960" height="520" rx="24" fill="#0b1220"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="72" y="50" fill="#f8fafc" font-size="24" font-weight="700">LVN rejection — reclaim and retest</text>
    <rect x="72" y="86" width="816" height="180" rx="12" fill="#2563eb" opacity=".12" stroke="#5b8cff" stroke-width="2"/><text x="736" y="108" fill="#94a3b8" font-size="14">UPPER DISTRIBUTION</text>
    <rect x="72" y="266" width="816" height="105" rx="8" fill="#f4c95d" opacity=".08" stroke="#f4c95d" stroke-dasharray="7 6"/><text x="805" y="319" fill="#f4c95d" font-size="14">LVN</text>
    <g stroke-width="2" stroke-dasharray="8 7"><path d="M72 138H888" stroke="#38e08f"/><path d="M72 266H888" stroke="#f4c95d"/><path d="M72 371H888" stroke="#ef5b5b"/></g>
    <g font-size="14" font-weight="700"><text x="76" y="128" fill="#38e08f">UPPER POC / TARGET 1 · 102.50</text><text x="76" y="256" fill="#f4c95d">UPPER LVN LIP R · 100.00</text><text x="76" y="361" fill="#ef5b5b">LOWER LVN LIP · 98.80</text></g>
    <path d="M95 150L175 225L250 170L330 245L415 332L490 354L555 288L620 238L685 272L755 205L830 135L875 105" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="490" cy="354" r="8" fill="#ef5b5b"/><circle cx="620" cy="238" r="8" fill="#38e08f"/><circle cx="685" cy="272" r="9" fill="#f4c95d"/>
    <path d="M620 218V178" stroke="#38e08f" stroke-width="2" marker-end="url(#arrow)"/><text x="558" y="168" fill="#38e08f" font-size="14" font-weight="700">RECLAIM AUTHORIZES</text>
    <path d="M685 292V330" stroke="#f4c95d" stroke-width="2" marker-end="url(#arrow)"/><text x="623" y="354" fill="#f4c95d" font-size="16" font-weight="700">BUY · 100.20</text>
    <rect x="72" y="448" width="816" height="42" rx="9" fill="#172033"/><text x="92" y="474" fill="#cbd5e1" font-size="15">Cancel unfilled: acceptance inside LVN · upper POC trades first · trigger expires</text>
  </g>
</svg>
