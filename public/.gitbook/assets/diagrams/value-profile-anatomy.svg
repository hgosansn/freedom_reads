  <title id="title">Volume profile anatomy</title>
  <desc id="desc">A horizontal volume distribution identifies value-area high, point of control, value-area low, high-volume nodes, and low-volume nodes.</desc>
  <rect width="960" height="460" rx="24" fill="#0b1220"/>
  <g fill="#29405f"><rect x="165" y="55" width="110" height="16"/><rect x="165" y="77" width="155" height="16"/><rect x="165" y="99" width="230" height="16"/><rect x="165" y="121" width="310" height="16"/><rect x="165" y="143" width="410" height="16"/><rect x="165" y="165" width="520" height="16"/><rect x="165" y="187" width="615" height="16"/><rect x="165" y="209" width="680" height="16"/><rect x="165" y="231" width="575" height="16"/><rect x="165" y="253" width="455" height="16"/><rect x="165" y="275" width="330" height="16"/><rect x="165" y="297" width="200" height="16"/><rect x="165" y="319" width="285" height="16"/><rect x="165" y="341" width="390" height="16"/><rect x="165" y="363" width="265" height="16"/><rect x="165" y="385" width="150" height="16"/></g>
