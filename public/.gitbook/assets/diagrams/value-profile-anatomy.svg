  <g stroke-width="2" stroke-dasharray="7 7"><path d="M95 137H885" stroke="#5b8cff"/><path d="M95 297H885" stroke="#5b8cff"/></g>
  <g fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="18"><text x="95" y="130">VAH</text><text x="95" y="225">POC</text><text x="95" y="317">VAL</text><text x="785" y="195">HVN</text><text x="375" y="315">LVN</text></g>
  <text x="165" y="430" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Bar length represents traded volume at price</text>
</svg>
