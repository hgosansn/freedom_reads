<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Trend pullback confirmation-retest entry model</title>
  <desc id="desc">Long example: an uptrend pulls into a 100 to 101 support zone, rejects, breaks an internal lower high, then retests a 101.40 buy limit. The structural swing at 99.60 invalidates and the prior high at 105 is the first target.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#f8fafc"/></marker></defs>
  <rect width="960" height="520" rx="24" fill="#0b1220"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="72" y="50" fill="#f8fafc" font-size="24" font-weight="700">Trend pullback — confirmation and retest</text>
    <rect x="300" y="286" width="390" height="74" rx="10" fill="#2563eb" opacity=".14" stroke="#5b8cff" stroke-width="2"/><text x="316" y="345" fill="#94a3b8" font-size="14">PLANNED SUPPORT · 100.00–101.00</text>
    <g stroke-width="2" stroke-dasharray="8 7"><path d="M72 112H888" stroke="#38e08f"/><path d="M72 266H888" stroke="#f4c95d"/><path d="M72 386H888" stroke="#ef5b5b"/></g>
    <g font-size="15" font-weight="700"><text x="76" y="102" fill="#38e08f">PRIOR HIGH / TARGET 1 · 105.00</text><text x="76" y="256" fill="#f4c95d">TRIGGER BASE T / LIMIT · 101.40</text><text x="76" y="376" fill="#ef5b5b">STRUCTURAL INVALIDATION · 99.60</text></g>
    <path d="M90 330L170 240L245 275L330 150L410 110L475 190L535 245L590 350L640 300L700 220L755 270L820 170L875 100" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="590" cy="350" r="8" fill="#ef5b5b"/><circle cx="700" cy="220" r="8" fill="#38e08f"/><circle cx="755" cy="270" r="9" fill="#f4c95d"/>
    <path d="M700 202V160" stroke="#38e08f" stroke-width="2" marker-end="url(#arrow)"/><text x="638" y="150" fill="#38e08f" font-size="14" font-weight="700">INTERNAL HIGH BREAK</text>
    <path d="M755 290V330" stroke="#f4c95d" stroke-width="2" marker-end="url(#arrow)"/><text x="694" y="354" fill="#f4c95d" font-size="16" font-weight="700">BUY · 101.40</text>
    <rect x="72" y="448" width="816" height="42" rx="9" fill="#172033"/><text x="92" y="474" fill="#cbd5e1" font-size="15">Cancel unfilled: 105.00 trades first · bearish acceptance below zone · trigger expires</text>
  </g>
</svg>
