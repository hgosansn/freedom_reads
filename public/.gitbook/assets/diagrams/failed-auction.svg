  <path d="M70 255H890" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 7"/>
  <path d="M85 295L170 210L255 280L340 185L430 265L520 165L595 82L650 135L710 205L790 250L875 290" fill="none" stroke="#ef5b5b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
